<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2b24"/>
      <stop offset="100%" stop-color="#0f1914"/>
    </linearGradient>

    <!-- Snake Body Gradient -->
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd87d"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>

    <!-- Berry Gradient -->
    <radialGradient id="berryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="60%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#9b111e"/>
    </radialGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#40916c" stroke-width="8"/>

  <!-- Subtle Playfield Grid Lines -->
  <g stroke="#2d4a3e" stroke-width="2" opacity="0.35">
    <line x1="80" y1="80" x2="432" y2="80"/>
    <line x1="80" y1="168" x2="432" y2="168"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="344" x2="432" y2="344"/>
    <line x1="80" y1="432" x2="432" y2="432"/>
    <line x1="80" y1="80" x2="80" y2="432"/>
    <line x1="168" y1="80" x2="168" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="344" y1="80" x2="344" y2="432"/>
    <line x1="432" y1="80" x2="432" y2="432"/>
  </g>

  <!-- Snake Body Tail & Curves -->
  <circle cx="140" cy="380" r="36" fill="url(#snakeGrad)"/>
  <circle cx="210" cy="380" r="40" fill="url(#snakeGrad)"/>
  <circle cx="270" cy="350" r="42" fill="url(#snakeGrad)"/>
  <circle cx="280" cy="275" r="44" fill="url(#snakeGrad)"/>
  <circle cx="230" cy="215" r="46" fill="url(#snakeGrad)"/>
  <circle cx="160" cy="200" r="48" fill="url(#snakeGrad)"/>
  <circle cx="140" cy="130" r="50" fill="url(#snakeGrad)"/>

  <!-- Connecting Path for Seamless Organic Snake -->
  <path d="M 140 380 Q 210 380 270 350 Q 290 280 230 215 Q 150 200 140 130" fill="none" stroke="url(#snakeGrad)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Snake Head -->
  <circle cx="230" cy="115" r="62" fill="url(#snakeGrad)" filter="url(#glow)"/>

  <!-- Head Cheek Blush -->
  <circle cx="250" cy="140" r="14" fill="#ff758f" opacity="0.6"/>

  <!-- Eyes -->
  <ellipse cx="215" cy="85" rx="14" ry="18" fill="#ffffff"/>
  <ellipse cx="219" cy="85" rx="8" ry="11" fill="#1b263b"/>
  <circle cx="221" cy="81" r="3.5" fill="#ffffff"/>

  <ellipse cx="255" cy="95" rx="16" ry="20" fill="#ffffff"/>
  <ellipse cx="260" cy="95" rx="9" ry="12" fill="#1b263b"/>
  <circle cx="263" cy="90" r="4" fill="#ffffff"/>

  <!-- Happy Smile -->
  <path d="M 245 135 Q 260 148 275 130" fill="none" stroke="#10281b" stroke-width="5" stroke-linecap="round"/>

  <!-- Sweet Berry (Food Item) -->
  <g filter="url(#glow)">
    <circle cx="360" cy="140" r="44" fill="url(#berryGrad)"/>
    <ellipse cx="346" cy="124" rx="14" ry="9" fill="#ffffff" opacity="0.65" transform="rotate(-30 346 124)"/>

    <path d="M 360 98 Q 365 75 385 70" fill="none" stroke="#588157" stroke-width="6" stroke-linecap="round"/>
    <path d="M 365 88 Q 395 85 395 105 Q 375 108 365 88 Z" fill="#84a98c"/>
  </g>

  <!-- Sparkles / Glow accents -->
  <path d="M 405 180 L 410 195 L 425 200 L 410 205 L 405 220 L 400 205 L 385 200 L 400 195 Z" fill="#00f3ff" opacity="0.85"/>
  <path d="M 320 230 L 323 240 L 333 243 L 323 246 L 320 256 L 317 246 L 307 243 L 317 240 Z" fill="#ffd166" opacity="0.8"/>
</svg>
